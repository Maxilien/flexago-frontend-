<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlexaGo – Ship Smarter. Travel Smarter.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* NAVBAR */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #fff;
      padding: 16px 40px;
      position: sticky;
      top: 0;
      z-index: 1000;
      animation: fadeIn 1s ease-in;
    }

    .logo img {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-link {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      opacity: 0.9;
    }

    .nav-link:hover {
      opacity: 1;
    }

    .nav-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .nav-btn.signup {
      background: #10b981;
    }

    /* HERO SECTION */
    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 80px 60px;
      background: #ffffff;
      animation: fadeSlide 1.2s ease-out;
    }

    .hero-content {
      max-width: 480px;
    }

    .hero-content h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: #475569;
      margin-bottom: 24px;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
    }

    .btn-primary, .btn-secondary {
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 1rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .hero-image img {
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      animation: fadeIn 1.5s ease-in;
    }

    /* ANIMATIONS */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* SCROLL ANIMATION */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .fade-in-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* FOOTER */
    footer {
      background: #0f172a;
      color: #fff;
      padding: 40px;
      text-align: center;
      margin-top: 60px;
    }

    footer a {
      color: #93c5fd;
      text-decoration: none;
      margin: 0 10px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .hero-image img {
        width: 90%;
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

<!-- ========================================================= -->
<!-- NAVBAR — Unified FlexaGo Banner                           -->
<!-- ========================================================= -->
<nav>
  <div class="nav-left">
    <div class="logo">
      <img src="IMG/flexago-logo.JPG" alt="FlexaGo Logo">
    </div>
  </div>

  <div class="nav-right">
    <a href="#senders" class="nav-link">Sender</a>
    <a href="#travelers" class="nav-link">Traveler</a>
    <a href="#how" class="nav-link">How it Works</a>
    <a href="#contact" class="nav-link">Contact</a>

    <button class="nav-btn" onclick="window.location.href='login.html'">Login</button>
    <button class="nav-btn signup" onclick="window.location.href='signup.html'">Sign Up</button>
  </div>
</nav>


<!-- ========================================================= -->
<!-- HERO SECTION                                              -->
<!-- ========================================================= -->
<section class="hero fade-in-up">
  <div class="hero-content">
    <h1>Ship Smarter. Travel Smarter.</h1>
    <p>FlexaGo connects travelers with people who need to send items — fast, secure, and affordable.</p>

    <div class="hero-buttons">
      <a href="#how" class="btn-primary">Get Started</a>
      <a href="#features" class="btn-secondary">Learn More</a>
    </div>
  </div>

  <div class="hero-image">
    <img src="IMG/flexago-hero.jpg" alt="FlexaGo Delivery">
  </div>
</section>


<!-- ========================================================= -->
<!-- FOOTER                                                    -->
<!-- ========================================================= -->
<footer>
  <p>© 2026 FlexaGo. All rights reserved.</p>
  <p>
    <a href="privacy.html">Privacy Policy</a> |
    <a href="terms.html">Terms of Service</a>
  </p>
</footer>

<script>
  // Scroll-triggered animation
  const fadeElements = document.querySelectorAll('.fade-in-up');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  });
  fadeElements.forEach(el => observer.observe(el));
</script>

</body>
</html>
