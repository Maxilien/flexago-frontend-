<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="js/app-core.js"></script>
  <title>Login – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ============================================================
       UPDATED — PURE BLACK BANNER
    ============================================================ */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000000; /* PURE BLACK */
      padding: 14px 20px;
      color: #fff;
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .top-nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .flexago-logo-img {
      height: 40px;
      width: auto;
      display: block;
    }

    .top-nav-title-main {
      font-size: 20px;
      font-weight: 700;
    }

    .top-nav-title-sub {
      font-size: 13px;
      opacity: 0.8;
    }

    .top-nav-links {
      display: flex;
      gap: 16px;
    }

    .top-nav-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
    }

    .top-nav-link:hover {
      opacity: 1;
    }

    .lang-select {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
    }
  </style>
  <link rel="icon" type="image/png" href="IMG/flexago-icon.png" />
  <link rel="stylesheet" href="css/brand.css" />
</head>

<body>

<!-- ========================================================= -->
<!-- TOP NAVBAR — Unified FlexaGo Banner                       -->
<!-- ========================================================= -->
<header class="top-nav">
  <div class="top-nav-left">

    <!-- ⭐ FLEXAGO LOGO (lowercase img/) -->
    <div class="flexago-logo">
      <img src="IMG/flexago-logo.png" alt="Flexago Logo" class="flexago-logo-img">
    <span class="flexago-wordmark">FlexaGo</span>
    </div>

    <!-- Title (Login-specific) -->
    <div class="top-nav-title">
      <div class="top-nav-title-main">
        Login to FlexaGo
      </div>
      <div class="top-nav-title-sub">
        Logistics marketplace for travelers & senders
      </div>
    </div>

  </div>

  <div class="top-nav-right">

    <!-- Navigation -->
    <nav class="top-nav-links">
      <a href="https://www.flexagoo.com" class="top-nav-link" target="_blank" rel="noopener" data-i18n="auth.about">About</a>
    </nav>

    <!-- Language Selector -->
    <select class="lang-select" id="languageSelector">
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
      <option value="ht">HT</option>
      <option value="zh">ZH</option>
      <option value="pt">PT</option>
    </select>

  </div>
</header>


<div class="login-container">

  <h2 data-i18n="auth.login">Login</h2>

  <input id="email" class="input-field" type="email" inputmode="email" autocomplete="email" placeholder="Email" data-i18n-placeholder="auth.email" />
  <input id="password" class="input-field" type="password" autocomplete="current-password" placeholder="Password" data-i18n-placeholder="auth.password_plain" />

  <button id="login-btn" class="login-btn" data-i18n="auth.login">Login</button>
  <p style="text-align:center;margin-top:16px;"><span data-i18n="auth.no_account">New to Flexago?</span> <a href="signup" data-i18n="auth.create_button">Create account</a></p>

</div>

<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="login.js"></script>

</body>
</html>
