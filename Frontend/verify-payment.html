<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Payment Method – Flexago Sender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .verify-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .input-field {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 1rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background: #1e4fc7;
    }

    .error {
      color: #dc2626;
      margin-top: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="verify-container">

  <h1>Add Payment Method</h1>
  <p>Senders must add a payment method before creating deliveries.</p>

  <input id="cardName" class="input-field" placeholder="Name on card" />
  <input id="cardNumber" class="input-field" placeholder="Card number" maxlength="19" />
  <input id="expiry" class="input-field" placeholder="MM/YY" maxlength="5" />
  <input id="cvc" class="input-field" placeholder="CVC" maxlength="4" />

  <button id="savePaymentBtn" class="primary-btn">
    Save Payment Method
  </button>

  <div id="errorMsg" class="error"></div>

</div>

<script>
  // Load user
  const user = JSON.parse(localStorage.getItem("flexagoUser"));
  if (!user) window.location.href = "/signup.html";

  // Only senders should be here
  if (user.role !== "sender") {
    window.location.href = "/traveler.html";
  }

  const errorMsg = document.getElementById("errorMsg");

  function showError(msg) {
    errorMsg.textContent = msg;
  }

  document.getElementById("savePaymentBtn").onclick = async () => {
    const cardName = document.getElementById("cardName").value.trim();
    const cardNumber = document.getElementById("cardNumber").value.trim();
    const expiry = document.getElementById("expiry").value.trim();
    const cvc = document.getElementById("cvc").value.trim();

    // Basic validation
    if (!cardName || !cardNumber || !expiry || !cvc) {
      showError("Please fill out all fields.");
      return;
    }

    if (!/^\d{13,19}$/.test(cardNumber.replace(/\s/g, ""))) {
      showError("Invalid card number.");
      return;
    }

    if (!/^\d{2}\/\d{2}$/.test(expiry)) {
      showError("Expiry must be in MM/YY format.");
      return;
    }

    if (!/^\d{3,4}$/.test(cvc)) {
      showError("Invalid CVC.");
      return;
    }

    // Clear error
    showError("");

    const res = await fetch("https://flexago-backend.onrender.com/api/verify/payment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        userId: user._id,
        cardName,
        cardNumber,
        expiry,
        cvc
      })
    });

    const data = await res.json();

    if (data.success) {
      user.paymentMethodAdded = true;
      localStorage.setItem("flexagoUser", JSON.stringify(user));

      // Sender is now fully verified
      window.location.href = "/Sender.html";
    } else {
      showError("Unable to save payment method. Try again.");
    }
  };
</script>

</body>
</html>
