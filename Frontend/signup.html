<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flexago Signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Signup CSS -->
  <link rel="stylesheet" href="css/signup.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide"></script>
</head>

<body>

<!-- ========================================================= -->
<!-- TOP NAVBAR — Unified FlexaGo Banner                       -->
<!-- ========================================================= -->
<header class="top-nav">
  <div class="top-nav-left">

    <!-- ⭐ FLEXAGO LOGO -->
    <div class="flexago-logo">
      <img src="IMG/flexago-logo.JPG" alt="Flexago Logo" class="flexago-logo-img">
    </div>

    <!-- Title (Signup-specific) -->
    <div class="top-nav-title">
      </div>
      <div class="top-nav-title-sub">
        Logistics marketplace
      </div>
    </div>

  </div>

  <div class="top-nav-right">

    <!-- Navigation -->
    <nav class="top-nav-links">
      <a href="Sender.html" class="top-nav-link">Sender</a>
      <a href="Traveler.html" class="top-nav-link">Traveler</a>
    </nav>

    <!-- Language Selector -->
    <select class="lang-select" id="languageSelector">
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
      <option value="ht">HT</option>
      <option value="zh">ZH</option>
      <option value="pt">PT</option>
    </select>

  </div>
</header>


  <!-- MAIN SIGNUP CONTAINER -->
  <main class="signup-container">
    <h2>Create Your Flexago Account</h2>

    <div class="signup-form">

      <label class="role-label">First Name</label>
      <input id="firstName" class="input-field" placeholder="First name" />

      <label class="role-label">Last Name</label>
      <input id="lastName" class="input-field" placeholder="Last name" />

      <button id="nextBtn" class="signup-btn">Next</button>

      <p class="signup-login-text">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="signup-footer">
    <div class="footer-column">
      <h3>Company</h3>
      <a href="about.html">About Us</a>
      <a href="#">Newsroom</a>
      <a href="#">Careers</a>
    </div>

    <div class="footer-column">
      <h3>Products</h3>
      <a href="Sender.html">Sender</a>
      <a href="Traveler.html">Traveler</a>
      <a href="#">Flexago Business</a>
    </div>

    <div class="footer-column">
      <h3>Legal</h3>
      <a href="https://maxilien.github.io/Flexago-Legal/privacy.html" target="_blank">Privacy Policy</a>
      <a href="https://maxilien.github.io/Flexago-Legal/terms.html" target="_blank">Terms of Service</a>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script src="signup.js"></script>

</body>
</html>
