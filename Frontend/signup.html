<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign up – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="icon" type="image/png" href="IMG/flexago-icon.png" />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body data-step="signup">
<header class="top-nav">
  <div class="top-nav-left">
    <div class="flexago-logo">
      <img src="IMG/flexago-logo.png" alt="Flexago" class="flexago-logo-img" />
      <span class="flexago-wordmark">FlexaGo</span>
    </div>
    <div>
            <div class="top-nav-title-sub" data-i18n="auth.tagline">Logistics marketplace for travelers &amp; senders</div>
    </div>
  </div>
  <select class="lang-select" id="languageSelector" aria-label="Language">
      <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      <option value="ht">HT</option><option value="zh">ZH</option><option value="pt">PT</option>
    </select>
</header>
<main>
  <div class="card">
    <div class="steps" aria-hidden="true"><span class="done"></span><span class=""></span><span class=""></span><span class=""></span><span class=""></span></div>
    <p class="step-label" data-i18n="auth.step1">Step 1 of 5</p>
    <h1 data-i18n="auth.signup_title">Create your account</h1>
    <p class="lead" data-i18n="auth.signup_lead">Use your legal name exactly as it appears on your government ID.</p>
    <form id="startForm" novalidate>
      <label for="firstName" data-i18n="auth.first_name">Legal first name</label>
      <input id="firstName" class="input-field" autocomplete="given-name" required />
      <label for="lastName" data-i18n="auth.last_name">Legal last name</label>
      <input id="lastName" class="input-field" autocomplete="family-name" required />
      <label data-i18n="auth.role_question">How will you use Flexago?</label>
      <div class="role-options">
        <label><input type="radio" name="role" value="sender" /> <span data-i18n="auth.role_sender">Send packages</span></label>
        <label><input type="radio" name="role" value="traveler" /> <span data-i18n="auth.role_traveler">Carry packages</span></label>
      </div>
      <button class="btn" type="submit" data-i18n="auth.continue">Continue</button>
    </form>
    <p class="switch"><span data-i18n="auth.have_account">Already have an account?</span> <a href="login" data-i18n="auth.login">Login</a></p>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>
</main>
<footer class="site-footer">
  <a href="https://www.flexagoo.com/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">Privacy Policy</a>
  <a href="https://www.flexagoo.com/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">Terms of Service</a>
</footer>
<script src="js/app-core.js"></script>
<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
