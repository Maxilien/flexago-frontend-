<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Background check – FlexaGo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="icon" type="image/png" href="IMG/flexago-icon.png" />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body>
<header class="top-nav">
  <div class="top-nav-left">
    <div class="flexago-logo">
      <img src="IMG/flexago-logo.png" alt="Flexago" class="flexago-logo-img" />
      <span class="flexago-wordmark">FlexaGo</span>
    </div>
    <div>
            <div class="top-nav-title-sub" data-i18n="auth.tagline">Logistics marketplace for travelers &amp; senders</div>
    </div>
  </div>
  <select class="lang-select" id="languageSelector" aria-label="Language">
      <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      <option value="ht">HT</option><option value="zh">ZH</option><option value="pt">PT</option>
    </select>
</header>
<main>
  <div class="card">
    <p class="step-label">Final step</p>
    <h1 id="bgTitle">Background check</h1>
    <p id="bgText" class="lead">Loading...</p>
    <button id="bgStart" class="btn hidden" type="button">Start background check</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>
</main>
<footer class="site-footer">
  <a href="https://www.flexagoo.com/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">Privacy Policy</a>
  <a href="https://www.flexagoo.com/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">Terms of Service</a>
</footer>
<script src="js/app-core.js"></script>
<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="js/background-check.js"></script>
</body>
</html>
