<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create account – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="icon" type="image/png" href="IMG/flexago-icon.png" />
  <link rel="stylesheet" href="css/brand.css" />
</head>
<body data-step="create-account">
<header class="top-nav">
  <div class="top-nav-left">
    <div class="flexago-logo">
      <img src="IMG/flexago-logo.png" alt="Flexago" class="flexago-logo-img" />
      <span class="flexago-wordmark">FlexaGo</span>
    </div>
    <div>
            <div class="top-nav-title-sub" data-i18n="auth.tagline">Logistics marketplace for travelers &amp; senders</div>
    </div>
  </div>
  <select class="lang-select" id="languageSelector" aria-label="Language">
      <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      <option value="ht">HT</option><option value="zh">ZH</option><option value="pt">PT</option>
    </select>
</header>
<main>
  <div class="card">
    <div class="steps" aria-hidden="true"><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span><span class="done"></span></div>
    <p class="step-label" data-i18n="auth.step5">Step 5 of 5</p>
    <h1 data-i18n="auth.create_title">Finish your account</h1>
    <p class="lead" data-i18n="auth.create_lead">These details are verified and can't be changed.</p>
    <label for="fullName" data-i18n="auth.full_name">Full name</label>
    <input id="fullName" class="input-field" readonly />
    <label for="email" data-i18n="auth.email">Email</label>
    <input id="email" class="input-field" readonly />
    <label for="phone" data-i18n="auth.phone">Phone number</label>
    <input id="phone" class="input-field" readonly />
    <form id="createForm" novalidate>
      <label for="dob" data-i18n="auth.dob">Date of birth</label>
      <input id="dob" class="input-field" type="date" autocomplete="bday" required />
      <label for="password" data-i18n="auth.password">Create password</label>
      <input id="password" class="input-field" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirmPassword" data-i18n="auth.confirm_password">Confirm password</label>
      <input id="confirmPassword" class="input-field" type="password" autocomplete="new-password" minlength="8" required />
      <p class="fine-print" data-i18n="auth.password_hint">Use at least 8 characters.</p>
      <button class="btn" type="submit" data-i18n="auth.create_button">Create account</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>
</main>
<footer class="site-footer">
  <a href="https://www.flexagoo.com/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">Privacy Policy</a>
  <a href="https://www.flexagoo.com/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">Terms of Service</a>
</footer>
<script src="js/app-core.js"></script>
<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
