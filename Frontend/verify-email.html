<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify email – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/onboarding.css" />
  <link rel="icon" type="image/png" href="IMG/flexago-icon.png" />
</head>
<body data-step="verify-email">
<header class="top-nav">
  <div class="top-nav-left">
    <img src="IMG/flexago-logo.png" alt="Flexago" class="flexago-logo-img" />
    <div>
      <div class="top-nav-title-main">FlexaGo</div>
      <div class="top-nav-title-sub" data-i18n="auth.tagline">Logistics marketplace for travelers &amp; senders</div>
    </div>
  </div>
  <select class="lang-select" id="languageSelector" aria-label="Language">
      <option value="en">EN</option><option value="es">ES</option><option value="fr">FR</option>
      <option value="ht">HT</option><option value="zh">ZH</option><option value="pt">PT</option>
    </select>
</header>
<main>
  <div class="card">
    <div class="steps" aria-hidden="true"><span class="done"></span><span class="done"></span><span class=""></span><span class=""></span><span class=""></span></div>
    <p class="step-label" data-i18n="auth.step2">Step 2 of 5</p>
    <h1 data-i18n="auth.email_title">Verify your email</h1>
    <p class="lead" data-i18n="auth.email_lead">We'll send a 6-digit code to confirm this email is yours.</p>
    <label for="email" data-i18n="auth.email">Email</label>
    <input id="email" class="input-field" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" />
    <button id="sendBtn" class="btn btn-secondary" type="button" data-i18n="auth.send_code">Send code</button>
    <label for="code" data-i18n="auth.code">Verification code</label>
    <input id="code" class="input-field" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" />
    <button id="verifyBtn" class="btn" type="button" data-i18n="auth.verify_continue">Verify and continue</button>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </div>
</main>
<footer class="site-footer">
  <a href="https://www.flexagoo.com/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">Privacy Policy</a>
  <a href="https://www.flexagoo.com/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">Terms of Service</a>
</footer>
<script src="js/app-core.js"></script>
<script src="i18n.js"></script>
<script src="i18n-extra.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
